server.port=${PORT:3000}
spring.datasource.url=${SPRING_DATASOURCE_URLjdbc:jdbc:postgresql://localhost:5432/partitio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:partitio}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:partitio}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
app.jwt.secret=${JWT_SECRET:change-moi-avec-une-cle-longue-et-secrete}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.cookie-name=${JWT_COOKIE_NAME:partitio_token}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
file.upload-dir=/uploads

# Activation de la génération de la spécification OpenAPI 3.1
springdoc.api-docs.path=/api-docs
springdoc.api-docs.version=OPENAPI_3_1
# Chemin vers la documentation en ligne
# TODO désactiver ça pour la production
springdoc.swagger-ui.path=/swagger-ui.html
