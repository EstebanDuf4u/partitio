services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:11-alpine
    command: -connectRetries=60 -locations=filesystem:/flyway/migrations migrate
    environment:
      FLYWAY_URL: ${FLYWAY_URL}
      FLYWAY_USER: ${FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
    volumes:
      - ./db/migrations:/flyway/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      PORT: ${BACKEND_PORT}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE}
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT}:3000"

  frontend:
    build:
      context: ./partitio
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:8080"

volumes:
  postgres_data:
