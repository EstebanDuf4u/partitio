services:
  frontend:
    build:
      context: ./partitio
      dockerfile: ../dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./partitio:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0

  frontend-prod:
    profiles:
      - prod
    build:
      context: ./partitio
      dockerfile: ../dockerfile
      target: production
    ports:
      - "8080:80"
